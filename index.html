<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FW27 발주 대시보드</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f2; --surface:#ffffff; --surface-2:#f8f8f6; --border:#e3e2de; --border-strong:#cfcdc7;
  --text:#141413; --text-2:#55544f; --text-3:#8a8983;
  --accent:#2a78d6; --accent-soft:#e6f0fb; --accent-text:#1d5fae;
  --bar:#2a78d6; --bar-track:#ecebe7;
  --ss:#8a8983; --warn:#b26b00;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --fw-bg:#eef5fd; --fw-head:#cfe2f8; --fw-foot:#dcebfb; --nofw-bg:#f1f1ef; --gray-box:#efeeea;
  --ss-bg:#f1f1ee; --ss-head:#e2e1dc; --ss-foot:#e8e7e2; --ss-line:#9d9b94;
  --tco-bg:#f1f1ee; --tco-head:#e2e1dc; --tco-foot:#e8e7e2; --tco-line:#9d9b94;
  --tss-bg:#eef5fd; --tss-head:#d3e5f9; --tss-foot:#e0edfb; --tss-line:#6ea4e4; --tss-text:#1d5fae;
  --tfw-bg:#fff5cc; --tfw-head:#ffd84d; --tfw-foot:#ffe999; --tfw-hover:#ffeb99; --tfw-line:#e0a800; --tfw-text:#6b4600; --tfw-bar:#e0a100;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211; --surface:#1c1c1b; --surface-2:#232322; --border:#2f2f2d; --border-strong:#44443f;
    --text:#f3f3f1; --text-2:#c3c2b7; --text-3:#8d8c84;
    --accent:#3987e5; --accent-soft:#1d2c40; --accent-text:#8fbcf2;
    --bar:#3987e5; --bar-track:#2c2c2a; --warn:#e0a040;
    --shadow:none;
    --fw-bg:#172333; --fw-head:#1f3a5c; --fw-foot:#1c2e45; --nofw-bg:#1a1a19; --gray-box:#2a2a28; --ss-bg:#232322; --ss-head:#31312f; --ss-foot:#2a2a28; --ss-line:#6a6964; --tco-bg:#232322; --tco-head:#31312f; --tco-foot:#2a2a28; --tco-line:#6a6964; --tss-bg:#172333; --tss-head:#1f3a5c; --tss-foot:#1c2e45; --tss-line:#3987e5; --tss-text:#8fbcf2; --tfw-bg:#332a0f; --tfw-head:#5c4a0f; --tfw-foot:#463a12; --tfw-hover:#4d3f12; --tfw-line:#d9a520; --tfw-text:#ffd970; --tfw-bar:#e0a820;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1c1c1b; --surface-2:#232322; --border:#2f2f2d; --border-strong:#44443f;
  --text:#f3f3f1; --text-2:#c3c2b7; --text-3:#8d8c84;
  --accent:#3987e5; --accent-soft:#1d2c40; --accent-text:#8fbcf2;
  --bar:#3987e5; --bar-track:#2c2c2a; --warn:#e0a040;
  --shadow:none;
  --fw-bg:#172333; --fw-head:#1f3a5c; --fw-foot:#1c2e45; --nofw-bg:#1a1a19; --gray-box:#2a2a28; --ss-bg:#232322; --ss-head:#31312f; --ss-foot:#2a2a28; --ss-line:#6a6964; --tco-bg:#232322; --tco-head:#31312f; --tco-foot:#2a2a28; --tco-line:#6a6964; --tss-bg:#172333; --tss-head:#1f3a5c; --tss-foot:#1c2e45; --tss-line:#3987e5; --tss-text:#8fbcf2; --tfw-bg:#332a0f; --tfw-head:#5c4a0f; --tfw-foot:#463a12; --tfw-hover:#4d3f12; --tfw-line:#d9a520; --tfw-text:#ffd970; --tfw-bar:#e0a820;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
header.top{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
header.top .sub{color:var(--text-3);font-size:12px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:1px solid var(--border);background:var(--surface);padding:7px 16px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--text-2)}
.tab.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--text-2)}

/* filter bar */
.filters{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:var(--shadow)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;color:var(--text-2);font-size:13px}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent-soft);color:var(--accent-text);font-weight:700}
.flabel{font-size:12px;color:var(--text-3);margin-right:-2px}
.ms{position:relative}
.ms>button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--text-2);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms>button.act{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft);font-weight:600}
.ms .pop{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:40;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);width:280px;padding:8px}
.ms.open .pop{display:block}
.ms .pop input[type=search]{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--text);margin-bottom:6px}
.ms .opts{max-height:300px;overflow:auto}
.ms label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:13px}
.ms label:hover{background:var(--surface-2)}
.ms label .c{margin-left:auto;color:var(--text-3);font-size:11px}
.ms .acts{display:flex;gap:6px;border-top:1px solid var(--border);padding-top:6px;margin-top:6px}
.ms .acts button{flex:1;border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:4px;cursor:pointer;font-size:12px}
input.q{border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--surface);color:var(--text);width:180px;font-size:13px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--text-2);cursor:pointer;border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.chk.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.chk input{margin:0}
.reset{border:0;background:none;color:var(--accent-text);cursor:pointer;font-size:13px;text-decoration:underline}
.spacer{flex:1}

main{padding:20px 24px 60px;max-width:1920px;margin:0 auto}
.panel{display:none}.panel.on{display:block}
h2{font-size:16px;margin:28px 0 10px;display:flex;align-items:baseline;gap:10px}
h2 .hint{font-size:12px;color:var(--text-3);font-weight:400}

/* KPI */
.kpis{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--text-2);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.kpi .v small{font-size:13px;font-weight:600;color:var(--text-2);margin-left:2px}
.kpi .s{font-size:12px;color:var(--text-3);margin-top:2px}
.kpi.hero{border-color:var(--accent);background:linear-gradient(0deg,var(--surface),var(--accent-soft))}
.kpi.hero .v{font-size:32px}
.kpi.hero .l{color:var(--accent-text)}

/* tables */
.tblwrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
#frTbl th,#colTbl th{white-space:normal;line-height:1.25;vertical-align:bottom;word-break:keep-all}
#frTbl td,#colTbl td{padding:8px 7px}
#frTbl .bar,#colTbl .bar{width:56px}
tr.sub td{background:var(--surface-2);font-style:italic;color:var(--text-2)}
th{position:sticky;top:0;background:var(--surface-2);color:var(--text-2);font-weight:600;font-size:12px;cursor:pointer;user-select:none;z-index:1}
th.l,td.l{text-align:left}
th .ar{color:var(--accent);margin-left:2px}
tbody tr:hover{background:var(--surface-2)}
tbody tr.click{cursor:pointer}
tbody tr.sel{background:var(--accent-soft)}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--border-strong);position:sticky;bottom:0}
td.grp{border-left:1px solid var(--border)}
th.grp{border-left:1px solid var(--border)}
td.co{background:var(--tco-bg)}
th.co{background:var(--tco-head);color:var(--text)}
td.ss{background:var(--tss-bg)}
th.ss{background:var(--tss-head);color:var(--tss-text)}
td.fw{background:var(--tfw-bg)}
th.fw{background:var(--tfw-head);color:var(--tfw-text);font-weight:700}
tfoot td.co,tr.sub td.co{background:var(--tco-foot)}
tfoot td.ss,tr.sub td.ss{background:var(--tss-foot)}
tfoot td.fw,tr.sub td.fw{background:var(--tfw-foot)}
tbody tr:hover td.co{background:var(--tco-head)}
tbody tr:hover td.ss{background:var(--tss-head)}
tbody tr:hover td.fw{background:var(--tfw-hover)}
td.ss b{color:var(--tss-text)}
td.fw b{color:var(--tfw-text)}
td.fw .bar i{background:var(--tfw-bar)}
td.col,th.col{border-left:2px solid var(--tco-line)!important}
td.ssl,th.ssl{border-left:2px solid var(--tss-line)!important}
td.fwl,th.fwl{border-left:2px solid var(--tfw-line)!important}
td.fwr,th.fwr{border-right:2px solid var(--tfw-line)}
.barcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar{width:90px;height:8px;background:var(--bar-track);border-radius:4px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.muted{color:var(--text-3)}
.up{color:#d03b3b;font-weight:700}
.down{color:#2a6fd0;font-weight:700}
:root[data-theme="dark"] .up{color:#ff7b7b} :root[data-theme="dark"] .down{color:#7fb2f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .up{color:#ff7b7b}:root:not([data-theme="light"]) .down{color:#7fb2f5}}
.zero{color:var(--text-3)}
td.thumb{padding:4px 8px;width:84px}
td.thumb img{width:72px;height:44px;object-fit:contain;background:#fff;border-radius:4px;cursor:zoom-in;display:block}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);margin-right:3px;white-space:nowrap}
.tag.cap{border-color:#c9b6f0;color:#5b3fb5;background:#f3eefc}
.tag.gm{border-color:#9fd1bd;color:#0f7a55;background:#e8f6f0}
:root[data-theme="dark"] .tag.cap{background:#2b2440;color:#c7b6f5;border-color:#4b3d73}
:root[data-theme="dark"] .tag.gm{background:#173229;color:#8fdcbd;border-color:#2b5a49}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.cap{background:#2b2440;color:#c7b6f5;border-color:#4b3d73}:root:not([data-theme="light"]) .tag.gm{background:#173229;color:#8fdcbd;border-color:#2b5a49}}
.tag.s27fw{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}

/* model cards */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.model{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.mh{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap}
.mh .nm{font-weight:700;font-size:15px}
.mh .meta{font-size:12px;color:var(--text-3)}
.mh .tot{margin-left:auto;display:flex;gap:18px;align-items:baseline}
.mh .tot .k{font-size:11px;color:var(--text-3);display:block;text-align:right}
.mh .tot .v{font-size:18px;font-weight:700;display:block;text-align:right}
.mh .tot .v.a{font-size:15px;color:var(--text-2)}
.mh .tot .fwt .v{color:var(--accent-text)}
.mh .tot .fwt .k{color:var(--accent-text)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:12px}
.card{contain:layout paint;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.card.nofw{background:var(--nofw-bg)}
.card.nofw .mini{background:transparent;border:1px dashed var(--border-strong)}
.card.nofw .b{color:var(--text-3)}
.card .flag{position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:700;text-align:center;padding:3px 0;background:rgba(110,110,106,.88);color:#fff;letter-spacing:.02em}
.card .im{position:relative;background:#fff;height:120px;display:flex;align-items:center;justify-content:center;cursor:zoom-in;border-bottom:1px solid var(--border)}
.card .im img{max-width:100%;max-height:112px;object-fit:contain}
.card .im .noimg{color:#aaa;font-size:12px}
.card .b{padding:8px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.card .col{font-size:12px;font-weight:600;line-height:1.3;height:31px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .code{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tags{margin-top:auto;padding-top:6px;display:flex;flex-wrap:wrap;gap:3px}
.card .tags:empty{display:none}
.card .tags .tag{margin:0;white-space:normal}
.tag.fr{border-color:#333;background:#222;color:#fff}
.tag.note{border-color:#e0b86a;background:#fff6e2;color:#8a5a00}
.card .code{font-size:11px;color:var(--text-3)}
.card .q{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.card .q .fw{font-size:20px;font-weight:800;letter-spacing:-.02em}
.card .q .fw small{font-size:11px;font-weight:600;color:var(--text-3);margin-left:2px}
.card .q .amt{font-size:12px;color:var(--text-2)}
.card .fwbox{background:var(--fw-bg);border:1px solid transparent;border-radius:8px;padding:6px 8px;margin-top:4px}
.card.nofw .fwbox{background:transparent;border:1px dashed var(--border-strong)}
.card .kv{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:11px;color:var(--text-3);line-height:1.6}
.card .kv span{white-space:nowrap;flex:none}
.card .kv b{color:var(--text-2);font-weight:600;font-size:12px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.card .kv b small{font-weight:400;color:var(--text-3);font-size:11px}
.card .fwbox .kv.main b{font-size:19px;font-weight:800;color:var(--accent-text);letter-spacing:-.02em}
.card .fwbox .kv.main span{font-weight:700;color:var(--accent-text)}
.card.nofw .fwbox .kv.main b,.card.nofw .fwbox .kv.main span{color:var(--text-3)}
.card .mini{background:var(--gray-box);border:1px solid transparent;border-radius:8px;padding:6px 8px;margin-top:6px}
.card .tags{min-height:0}
.model.cchunk{margin-bottom:0;border-radius:0;border-top:0;border-bottom:0;box-shadow:none}
.model.cchunk .cards{padding-top:0;padding-bottom:10px}
.model.cchunk.first{border-top:1px solid var(--border);border-radius:12px 12px 0 0}
.model.cchunk.first .cards{padding-top:12px}
.model.cchunk.last{border-bottom:1px solid var(--border);border-radius:0 0 12px 12px;margin-bottom:12px}
.model.cchunk.first.last{border-radius:12px}
.empty{padding:40px;text-align:center;color:var(--text-3);background:var(--surface);border:1px dashed var(--border-strong);border-radius:12px}

/* color tab */
.famgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.fam{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.fam.on{border-color:var(--accent);background:var(--accent-soft)}
.fam .n{font-weight:700;display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.fam .v{font-size:20px;font-weight:700;margin-top:6px}
.fam .s{font-size:12px;color:var(--text-3)}
.fam .bar{width:100%;margin-top:8px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--surface);border-radius:14px;max-width:760px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .box .im{background:#fff;display:flex;justify-content:center;padding:14px}
.modal .box .im img{max-width:100%;max-height:52vh;object-fit:contain}
.modal .box .d{padding:14px 18px}
.modal .box .d h3{margin:0 0 4px;font-size:17px}
.modal .box table td,.modal .box table th{position:static;cursor:default}
.modal .x{float:right;border:0;background:none;font-size:22px;cursor:pointer;color:var(--text-3);line-height:1}
.cbtn{position:absolute;top:4px;left:4px;border:1px solid #d9d7d0;background:rgba(255,255,255,.9);border-radius:6px;font-size:12px;line-height:1;padding:3px 5px;cursor:pointer;opacity:.55;color:#555}
.card:hover .cbtn{opacity:1}
.cpeek{position:absolute;top:4px;right:4px;max-width:62%;background:#fff3b0;border:1px solid #e0b400;border-radius:6px 6px 2px 6px;padding:3px 6px;font-size:11px;line-height:1.35;color:#4a3a00;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.15);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;word-break:break-all;cursor:pointer;z-index:1;max-height:calc(4.05em + 8px)}
.cpeek:empty{display:none}
.cbtn.has{opacity:1;background:#ffe27a;border-color:#e0b400;color:#5a4500;font-weight:700}
.mcbtn{border:1px solid var(--border);background:var(--surface);border-radius:6px;font-size:12px;padding:3px 8px;cursor:pointer;color:var(--text-2);margin-left:8px;vertical-align:2px}
.mcbtn.has{background:#ffe27a;border-color:#e0b400;color:#5a4500;font-weight:700}
.mnote{display:none;padding:10px 14px;border-bottom:1px solid var(--border);background:#fffbe6}
.mnote.open{display:block}
.cmt{width:100%;min-height:54px;resize:vertical;border:1px solid #e6d58a;border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;background:#fffdf3;color:#222}
.cmt:focus{outline:2px solid #e0b400;outline-offset:0}
.cmeta{font-size:11px;color:var(--text-3);margin-top:3px}
:root[data-theme="dark"] .mnote{background:#2b2718} :root[data-theme="dark"] .cmt{background:#1f1c12;color:#f3f3f1;border-color:#5c5024}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mnote{background:#2b2718}:root:not([data-theme="light"]) .cmt{background:#1f1c12;color:#f3f3f1;border-color:#5c5024}}
.ocmt{margin:6px 0}
.oc{background:#fffdf3;border:1px solid #eadfb0;border-left:3px solid #e0b400;border-radius:6px;padding:5px 8px;margin-bottom:5px}
.oc .h{font-size:11px;color:var(--text-3)}
.oc .x2{font-size:12.5px;white-space:pre-wrap}
:root[data-theme="dark"] .oc{background:#1f1c12;border-color:#5c5024}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .oc{background:#1f1c12;border-color:#5c5024}}
.clist{max-height:60vh;overflow:auto;margin-top:8px}
.clist .it{border-bottom:1px solid var(--border);padding:8px 2px}
.clist .it .h{font-size:12px;color:var(--text-3)}
.clist .it .x2{white-space:pre-wrap;font-size:13px;margin-top:2px}
.mpbtn{font-weight:700}
.mpwrap{background:#fff;padding:10px;overflow:auto;max-height:78vh}
.mpwrap img{display:block;max-width:100%;width:auto;height:auto;margin:0 auto;cursor:zoom-in}
.mpwrap.zoom img{max-width:none;width:170%;cursor:zoom-out}
.modal .box.wide{max-width:min(1500px,96vw)}
.badge{font-size:12px;border-radius:999px;padding:5px 12px}
.badge.on{background:#e8f6f0;border-color:#9fd1bd;color:#0f7a55;font-weight:700}
.badge.off{background:var(--surface-2);color:var(--text-3)}
:root[data-theme="dark"] .badge.on{background:#173229;color:#8fdcbd;border-color:#2b5a49}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.on{background:#173229;color:#8fdcbd;border-color:#2b5a49}}
.savebtn{background:#ffe27a;border-color:#e0b400;color:#5a4500;font-weight:700}
.note{font-size:12px;color:var(--text-3);margin-top:8px}
@media (max-width:900px){
  header.top,.filters,main{padding-left:16px;padding-right:16px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi.hero{grid-column:1/-1}
  .mh .tot{margin-left:0}
  .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  header.top{flex-wrap:wrap}
}
@media print{.filters,.tabs,.iconbtn{display:none}.model{break-inside:avoid}}

<body>
<header class="top">
  <div>
    <h1>FW27 발주 대시보드</h1>
    <div class="sub">SPORTSTYLE · 출처: FW27 발주 백데이터.xlsx · 금액 = 소비자가 × 수량</div>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="p1">① 요약 · 프랜차이즈/모델</button>
    <button class="tab" data-tab="p2">② 컬러별</button>
  </div>
  <button class="iconbtn mpbtn" id="mpBtn" title="글로벌 마스터플랜 보기">🗓️ 글로벌 마스터플랜</button>
  <button class="iconbtn badge off" id="shareBadge" title="공유 상태 · 눌러서 표시 이름 변경">확인 중…</button>
  <button class="iconbtn" id="cmtListBtn" title="남긴 코멘트 모아보기">💬 코멘트 목록</button>
  <button class="iconbtn savebtn" id="cmtSaveBtn" title="코멘트가 포함된 새 HTML 파일로 저장">💾 코멘트 포함 저장</button>
  <button class="iconbtn" id="themeBtn" title="라이트/다크 전환">◐</button>
</header>

<div class="filters" id="filters">
  <span class="flabel">시즌</span>
  <div class="seg" id="fSeason"></div>
  <div class="ms" id="msFr"></div>
  <div class="ms" id="msModel"></div>
  <div class="ms" id="msRid"></div>
  <div class="ms" id="msPrice"></div>
  <div class="ms" id="msCap"></div>
  <div class="ms" id="msGm"></div>
  <input class="q" id="fq" type="search" placeholder="품번·제품명·컬러 검색">
  <label class="chk" id="chkFw"><input type="checkbox" id="fOnlyFw"> 27FW 발주 품번만</label>
  <span class="spacer"></span>
  <span class="flabel">판매금액</span>
  <div class="seg" id="fPriceMode"><button data-v="retail" class="on">소비자가</button><button data-v="real">실판가 (DC 2.1%)</button></div>
  <button class="reset" id="resetBtn">필터 초기화</button>
</div>

<main>
  <section class="panel on" id="p1">
    <div class="kpis" id="kpis"></div>

    <h2>프랜차이즈별 요약 <span class="seg shareSeg" style="font-weight:400;margin-left:6px"><button data-v="q" class="on">비중: 수량 기준</button><button data-v="a">금액 기준</button></span> <span class="hint">행 클릭 시 해당 프랜차이즈로 필터 · 금액 단위 백만원</span></h2>
    <div class="tblwrap" id="frTbl"></div>

    <h2>모델별 발주 수량 <span class="hint">이미지 클릭 시 확대</span></h2>
    <div class="toolbar">
      <div class="seg" id="viewMode"><button data-v="card" class="on">카드 보기</button><button data-v="list">리스트 보기</button></div>
      <span class="flabel">정렬</span>
      <div class="seg" id="sortMode">
        <button data-v="fwq" class="on">27FW 수량순</button><button data-v="fwa">27FW 금액순</button><button data-v="rid">출시월순</button><button data-v="price">소비자가순</button><button data-v="name">이름순</button>
      </div>
      <span class="spacer"></span>
      <button class="iconbtn" id="csvBtn">CSV 내보내기</button>
    </div>
    <div id="models"></div>
  </section>

  <section class="panel" id="p2">
    <div class="toolbar">
      <span class="flabel">묶음 기준</span>
      <div class="seg" id="colGroup"><button data-v="fam" class="on">컬러 계열</button><button data-v="c1">메인 컬러 (첫 번째 컬러)</button></div>
      <span class="spacer"></span>
      <span class="note" style="margin:0">컬러는 Article name에서 모델명 뒤 첫 번째 컬러 기준. 이월·27SS 일부는 원본에 컬러명이 없어 '컬러명 없음'으로 분류</span>
    </div>
    <div class="famgrid" id="famGrid"></div>
    <h2>컬러별 요약 <span class="seg shareSeg" style="font-weight:400;margin-left:6px"><button data-v="q" class="on">비중: 수량 기준</button><button data-v="a">금액 기준</button></span> <span class="hint">금액 단위 백만원 · 행 클릭 시 해당 컬러만 보기</span></h2>
    <div class="tblwrap" id="colTbl"></div>
    <div id="colSections"></div>
  </section>
</main>

const IMGURL={};
function imgURL(k){

}

/* ---------- filtering ---------- */
function filtered(skip){
  const q = st.q.trim().toUpperCase();
  return ROWS.filter(r=>{
    if(!st.season.has(r.season)) return false;
    if(skip!=='fr' && st.fr.size && !r.frs.some(v=>st.fr.has(v))) return false;
    if(skip!=='model' && st.model.size && !st.model.has(r.model)) return false;
    if(skip!=='rid' && st.rid.size && !st.rid.has(r.rid)) return false;
    if(skip!=='price' && st.price.size && !st.price.has(String(r.price))) return false;
    if(skip!=='cap' && st.cap.size && !st.cap.has(r.capsule||'(없음)')) return false;
    if(skip!=='gm' && st.gm.size && !st.gm.has(r.gmain||'(없음)')) return false;
    if(st.onlyFw && !(r.fwq>0)) return false;
    if(q && !(r.code+' '+r.model+' '+r.color+' '+r.fr).toUpperCase().includes(q)) return false;
    return true;
  });
}
function agg(rows){
  const f=salesF(), a={n:rows.length,coq:0,coa:0,ssq:0,ssa:0,fwq:0,fwa:0,sssq:0,sssa:0,fwsq:0,fwsa:0,models:new Set()};
  for(const r of rows){
    a.coq+=r.coq;a.coa+=r.coa;a.ssq+=r.ssq;a.ssa+=r.ssa;a.fwq+=r.fwq;a.fwa+=r.fwa;
    a.sssq+=r.sssq;a.sssa+=r.sssa*f;a.fwsq+=r.fwsq;a.fwsa+=r.fwsa*f;a.models.add(r.model);
  }
  a.nm=a.models.size; a.fwn=rows.filter(r=>r.fwq>0).length;
  return a;
}
function groupBy(rows,key){
  const m=new Map();
  for(const r of rows){const k=typeof key==='function'?key(r):r[key]; if(!m.has(k))m.set(k,[]); m.get(k).push(r);}
  return m;
}

const MS = {};
function makeMS(id,key,label,getVal,sortFn,fmt){
  const el=document.getElementById(id);
  el.innerHTML=`<button type="button"></button><div class="pop"><input type="search" placeholder="검색"><div class="opts"></div><div class="acts"><button data-a="clear">선택 해제</button><button data-a="close">닫기</button></div></div>`;
  const btn=el.querySelector('button'), pop=el.querySelector('.pop'), opts=el.querySelector('.opts'), s=el.querySelector('input');
  const obj={el,key,label,getVal,sortFn,fmt:fmt||(v=>v)};
  obj.render=()=>{
    const base=filtered(key), cnt=new Map();
    for(const r of base){for(const v of [].concat(getVal(r))) cnt.set(v,(cnt.get(v)||0)+r.fwq);}
    // all possible values (so selected ones never vanish)
    const all=[...new Set(ROWS.filter(r=>st.season.has(r.season)).flatMap(r=>[].concat(getVal(r))))].sort(sortFn);
    const qq=s.value.trim().toUpperCase();
    opts.innerHTML=all.filter(v=>!qq||String(obj.fmt(v)).toUpperCase().includes(qq)).map(v=>{
      const c=cnt.has(v);
      return `<label style="${c||st[key].has(v)?'':'opacity:.45'}"><input type="checkbox" value="${esc(v)}" ${st[key].has(v)?'checked':''}> <span>${esc(obj.fmt(v))}</span><span class="c num">${c?q0(cnt.get(v))+'족':''}</span></label>`}).join('');
    const sel=[...st[key]];
    btn.textContent = sel.length? `${label}: ${sel.length===1?obj.fmt(sel[0]):sel.length+'개'}` : `${label} 전체 ▾`;
    btn.classList.toggle('act',sel.length>0);
  };
  btn.onclick=e=>{e.stopPropagation();const o=el.classList.contains('open');document.querySelectorAll('.ms.open').forEach(x=>x.classList.remove('open'));if(!o){el.classList.add('open');s.value='';obj.render();s.focus();}};
  pop.onclick=e=>e.stopPropagation();
  s.oninput=obj.render;
  opts.onchange=e=>{const v=e.target.value; e.target.checked?st[key].add(v):st[key].delete(v); update();};
  el.querySelector('[data-a=clear]').onclick=()=>{st[key].clear();update();};
  el.querySelector('[data-a=close]').onclick=()=>el.classList.remove('open');
  MS[key]=obj;
}

/* ---------- sortable summary table ---------- */
function summaryTable(host,groups,firstCol,sortState,onRow,selKey,extraRows){
  const cols=[
    ['k',firstCol,'l'],['nm','모델수'],['n','품번수'],
    ['coq','이월 수량','co col'],['coa','이월 금액','co'],
    ['ssq','27SS 발주 수량','ss ssl'],['ssa','27SS 발주 금액','ss'],['ssshare',`27SS 발주 비중 (${SB()})`,'ss'],
    ['fwq','27FW 발주 수량','fw fwl'],['fwa','27FW 발주 금액','fw'],['share',`27FW 발주 비중 (${SB()})`,'fw'],['gr','증감율 (vs 이월+27SS)','fw fwr'],
    ['sssq','27SS 판매 수량','grp'],['sssa','27SS 판매 금액'],
    ['fwsq','27FW 판매 수량','grp'],['fwsa','27FW 판매 금액'],['fwsshare',`27FW 판매 비중 (${SB()})`],
    ['str','판매율','grp']
  ];
  const CL=Object.fromEntries(cols.map(([c,,cl])=>[c,cl||'']));
  const tot=agg(groups.flatMap(g=>g.rows));
  const rate=a=>{const s=a.coq+a.ssq+a.fwq;return s?(a.sssq+a.fwsq)/s:0;};
  const byA=st.shareBase==='a', R=(x,y)=>y?x/y:0;
  const fill=a=>{a.ssshare=byA?R(a.ssa,tot.ssa):R(a.ssq,tot.ssq);a.share=byA?R(a.fwa,tot.fwa):R(a.fwq,tot.fwq);a.fwsshare=byA?R(a.fwsa,tot.fwsa):R(a.fwsq,tot.fwsq);a.str=rate(a);a.gr=growth(a);return a;};
  const data=groups.map(g=>{const a=agg(g.rows);a.k=g.k;a.sw=g.sw;return fill(a);});
  fill(tot);
  const {k,d}=sortState;
  data.sort((x,y)=>k==='k'?d*cmpStr(x.k,y.k):d*((x[k]??-1e9)-(y[k]??-1e9)));

/* 화면 근처에 온 블록만 실제 DOM으로 만들고, 나머지는 예상 높이의 빈 자리만 둠 */
let lazyIO=null;
function lazyMount(host,items,html,estH){
  if(lazyIO){lazyIO.disconnect();lazyIO=null;}
  if(!('IntersectionObserver' in window)){host.innerHTML=items.map(html).join('');return;}
  host._lazy={items,html};
  // 첫 화면(약 1.3화면 높이)만 바로 그리고 나머지는 스크롤할 때 그림
  let acc=0; const lim=Math.max(innerHeight||0,700)*1.3;
  host.innerHTML=items.map((it,i)=>{const h=estH(it); const now=(i===0||acc<lim); acc+=h; return now?html(it):`<div class="lazyph" data-i="${i}" style="height:${h}px"></div>`;}).join('');
  const io=lazyIO=new IntersectionObserver(ents=>{
    for(const en of ents){ if(!en.isIntersecting) continue;
      const el=en.target; io.unobserve(el);
      const tmp=document.createElement('div'); tmp.innerHTML=html(items[+el.dataset.i]);
      el.replaceWith(...tmp.childNodes);
    }
  },{rootMargin:'1500px 0px'});
  host.querySelectorAll('.lazyph').forEach(el=>io.observe(el));
}
function flushLazy(){ // 인쇄처럼 전체가 한 번에 필요할 때
  document.querySelectorAll('.lazyph').forEach(el=>{const L=el.parentElement._lazy; if(!L) return;
    const tmp=document.createElement('div'); tmp.innerHTML=L.html(L.items[+el.dataset.i]); el.replaceWith(...tmp.childNodes);});
}

}

function othersHtml(k){
  const o=others(k); if(!o.length) return '';
  return `<div class="ocmt">${o.sort((a,b)=>b.t-a.t).map(e=>`<div class="oc"><div class="h"><b>${esc(nameOf(e.uid))}</b> · ${ctime(e.t)}</div><div class="x2">${esc(e.x)}</div></div>`).join('')}</div>`;
}
function refreshCommentsUI(){
  refreshCmtCount();
  document.querySelectorAll('.cbtn[data-sk]').forEach(b=>{const k='s:'+b.dataset.sk;b.classList.toggle('has',cAny(k));b.title=peekOf(k)||'품번 코멘트 남기기';});
  document.querySelectorAll('.cpeek[data-pk]').forEach(p=>{const k='s:'+p.dataset.pk;const x=peekOf(k);p.textContent=x;p.title=x;});
  document.querySelectorAll('.mcbtn[data-mk]').forEach(b=>{const k='m:'+b.dataset.mk;const has=cAny(k);b.classList.toggle('has',has);b.textContent=has?`💬 코멘트 ${withText(k).length}`:'💬 코멘트';});
  document.querySelectorAll('[data-others]').forEach(el=>{el.innerHTML=othersHtml(el.dataset.others);});
  document.querySelectorAll('textarea[data-ck]').forEach(ta=>{
    if(document.activeElement===ta) return;
    const v=cget(ta.dataset.ck); if(ta.value!==v) ta.value=v;
    const m=ta.parentElement.querySelector('.cmeta'); if(m) m.textContent=metaText(ta.dataset.ck);
  });
}
const cAll=k=>withText(k).map(e=>(withText(k).length>1?nameOf(e.uid)+': ':'')+e.x).join(' | ');
const metaText=k=>{const e=myEntry(k);return (e&&e.x?'내 코멘트 저장됨 · '+ctime(e.t):'입력하면 자동 저장됩니다')+(SHARED?(CANWRITE?' · 모두에게 공유됨':' · 저장 실패'):' · 이 브라우저에만 저장');};

/* --- 저장 --- */
function saveLocal(){
  if(SHARED) return;
  const o={}; CM.forEach((arr,k)=>{const e=arr.find(x=>x.uid===MYUID); if(e) o[k]={x:e.x,t:e.t};});
  try{localStorage.setItem(LSK,JSON.stringify(o))}catch(e){}
}
const wTimers={};
function cset(k,x){
  const now=Date.now(); setEntry(k,MYUID,x,now); saveLocal(); refreshCmtCount();
  if(!API||!SHARED) return;
  if(x.trim()&&!myName()){ const n=askName(); if(n) setShareBadge('공유 중 · '+n,'on'); }
  clearTimeout(wTimers[k]);
  wTimers[k]=setTimeout(async()=>{
    try{
      const res=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({item_key:k,author_id:MYUID,author_name:myName()||'익명',body:x,updated_at:Date.now()})});
      if(!res.ok) throw new Error(res.status);
      CANWRITE=true; setShareBadge('공유 중'+(myName()?' · '+myName():''),'on');
    }catch(err){ CANWRITE=false; setShareBadge('저장 실패 · 잠시 후 다시','off'); }
  },600);
}

/* --- 공용 저장소 연결 (Vercel /api/comments) ---
   웹에 올렸을 때만 동작. 파일로 열면 이 브라우저에만 저장됨 */
let API=null, POLL=null;
function myName(){ try{return localStorage.getItem('fw27_name')||''}catch(e){return ''} }
function askName(force){
  let n=myName();
  if(!n||force){
    n=(prompt('코멘트에 표시할 이름을 입력하세요 (예: 윤청우)', n||'')||'').trim();
    if(n){ try{localStorage.setItem('fw27_name',n)}catch(e){} NAMES[MYUID]=n; }
  }
  return n;
}
function myClientId(){
  let id=''; try{id=localStorage.getItem('fw27_uid')||''}catch(e){}
  if(!id){ id='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); try{localStorage.setItem('fw27_uid',id)}catch(e){} }
  return id;
}
function setShareBadge(txt,cls){
  const el=document.getElementById('shareBadge'); if(!el) return;
  el.textContent=txt; el.className='iconbtn badge '+(cls||'');
}
function applyRow(r){
  if(!r||!r.item_key) return;
  if(r.author_name) NAMES[r.author_id]=r.author_name;
  setEntry(r.item_key,r.author_id,r.body||'',r.updated_at||0);
}
async function pullComments(){
  if(!API) return;
  try{
    const res=await fetch(API,{cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    const rows=await res.json();
    const mineNow={}; CM.forEach((arr,k)=>{const e=arr.find(x=>x.uid===MYUID); if(e) mineNow[k]=e;});
    CM.clear(); rows.forEach(applyRow);
    // 방금 입력 중인 내 코멘트는 서버 응답보다 우선
    for(const k in mineNow){ const cur=myEntry(k); if(!cur||cur.t<mineNow[k].t) setEntry(k,MYUID,mineNow[k].x,mineNow[k].t); }
    if(!SHARED){ SHARED=true; setShareBadge('공유 중'+(myName()?' · '+myName():''),'on'); }
    refreshCommentsUI();
  }catch(err){ SHARED=false; setShareBadge('공유 연결 끊김','off'); }
}
async function initShared(){
  if(location.protocol==='file:'){ setShareBadge('이 브라우저에만 저장','off'); return; }
  const url=(window.COMMENT_API||'/api/comments');
  try{ const res=await fetch(url,{cache:'no-store'}); if(!res.ok) throw new Error(res.status); }
  catch(e){ setShareBadge('이 브라우저에만 저장','off'); return; }
  API=url; MYUID=myClientId(); const nm=myName(); if(nm) NAMES[MYUID]=nm;
  await pullComments();
  clearInterval(POLL);
  POLL=setInterval(()=>{ if(!document.hidden) pullComments(); },12000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pullComments(); });
}
(async()=>{
  try{const emb=JSON.parse(document.getElementById('cmtData').textContent.trim()||'{}');
      for(const k in emb) if(emb[k]&&emb[k].x) setEntry(k,'local',emb[k].x,emb[k].t||0);}catch(e){}
  try{const loc=JSON.parse(localStorage.getItem(LSK)||'{}');
      for(const k in loc) if(loc[k]&&loc[k].x) setEntry(k,MYUID,loc[k].x,loc[k].t||0);}catch(e){}
  refreshCommentsUI();
  await initShared();
})();
document.addEventListener('click',e=>{
  if(!e.target.closest('#shareBadge')) return;
  if(!SHARED){ alert('지금은 이 브라우저에만 저장됩니다. 여러 명이 함께 보려면 웹에 올린 주소로 접속하세요.'); return; }
  const n=askName(true); if(!n) return;
  setShareBadge('공유 중 · '+n,'on');
  const mineKeys=[]; CM.forEach((arr,k)=>{ if(arr.some(x=>x.uid===MYUID&&x.x&&x.x.trim())) mineKeys.push(k); });
  mineKeys.forEach(k=>cset(k,cget(k)));
  refreshCommentsUI();
});

document.addEventListener('input',e=>{
  const ta=e.target.closest('textarea[data-ck]'); if(!ta) return;
  const k=ta.dataset.ck; cset(k,ta.value);
  const has=!!ta.value.trim();
  if(k.startsWith('m:')) document.querySelectorAll(`.mcbtn[data-mk="${CSS.escape(k.slice(2))}"]`).forEach(b=>{b.classList.toggle('has',has||others(k).length>0);b.textContent=(has||others(k).length)?`💬 코멘트 ${withText(k).length}`:'💬 코멘트';});
  if(k.startsWith('s:')){
    document.querySelectorAll(`.cbtn[data-sk="${CSS.escape(k.slice(2))}"]`).forEach(b=>{b.classList.toggle('has',cAny(k));b.title=peekOf(k);});
    document.querySelectorAll(`.cpeek[data-pk="${CSS.escape(k.slice(2))}"]`).forEach(p=>{const x=peekOf(k);p.textContent=x;p.title=x;});
  }
  const m=ta.parentElement.querySelector('.cmeta'); if(m) m.textContent=metaText(k);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('.mcbtn'); if(!b) return;
  const box=b.closest('.model').querySelector('.mnote'); box.classList.toggle('open');
  if(box.classList.contains('open')) box.querySelector('textarea').focus();
});

    <div class="note">${SHARED?'코멘트는 이 주소로 접속한 모두에게 보입니다. 화면에서는 본인이 쓴 것만 수정돼요.':'지금은 이 브라우저에만 저장됩니다. 공유하려면 웹에 올린 주소로 접속하세요.'}</div></div>`;
  document.getElementById('modal').classList.add('on');
};
document.getElementById('cmtSaveBtn').onclick=()=>{
  const open='<script type="application/json" id="cmtData">';
  const i=SRC_HTML.indexOf(open), j=SRC_HTML.indexOf('</'+'script>',i);
  const o={}; CM.forEach((arr,k)=>{const e=arr.filter(x=>x.x&&x.x.trim()).sort((a,b)=>b.t-a.t)[0]; if(e) o[k]={x:withText(k).map(x=>(withText(k).length>1?nameOf(x.uid)+': ':'')+x.x).join('\n'),t:e.t};});
  const json=JSON.stringify(o).replace(/</g,'\\u003c');
  const html=SRC_HTML.slice(0,i+open.length)+json+SRC_HTML.slice(j);
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  saveFile(`FW27_발주_대시보드_코멘트_${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.html`,html,'text/html;charset=utf-8');
};

function closeModal(){document.getElementById('modal').classList.remove('on');}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ---------- CSV ---------- */
document.getElementById('csvBtn').onclick=()=>{
  const f=salesF(), rs=sortRows(filtered());
  const h=['시즌','프랜차이즈','제품명','컬러','제품코드','출시월','소비자가','글로벌캡슐','글로벌메인','이월수량','이월금액','27SS발주수량','27SS발주금액','27FW발주수량','27FW발주금액','27SS판매수량','27SS판매금액','27FW판매수량','27FW판매금액','모델 코멘트','품번 코멘트'];
  const lines=[h.join(',')].concat(rs.map(r=>[r.season,r.fr,r.model,r.color,r.code,r.rid,r.price,r.capsule,r.gmain,Math.round(r.coq),Math.round(r.coa),r.ssq,r.ssa,r.fwq,r.fwa,Math.round(r.sssq),Math.round(r.sssa*f),Math.round(r.fwsq),Math.round(r.fwsa*f),cAll('m:'+r.model),cAll('s:'+r.code)].map(v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(',')));
  saveFile('FW27_발주_필터결과.csv','\ufeff'+lines.join('\n'),'text/csv;charset=utf-8');
};

/* ---------- main ---------- */
function update(){
  segS.querySelectorAll('button').forEach(b=>b.classList.toggle('on',st.season.has(b.dataset.v)));
  document.getElementById('chkFw').classList.toggle('on',st.onlyFw);
  Object.values(MS).forEach(m=>m.render());
  const rows=filtered();
  renderKpis(rows);
  const byFr=groupBy(rows,'fr');
  summaryTable(document.getElementById('frTbl'),[...byFr].map(([k,rs])=>({k,rows:rs})),'프랜차이즈',st.frSort,
    k=>{ if(st.fr.size===1&&st.fr.has(k)) st.fr.clear(); else {st.fr.clear();st.fr.add(k);} update(); document.getElementById('models').scrollIntoView({behavior:'smooth'}); },
    k=>st.fr.has(k), [...TAGFR].map(k=>({k,rows:rows.filter(r=>r.frs.includes(k))})));
  if(activeTab()==='p1') renderModels(rows); else renderColors(rows);
}
try{const t=localStorage.getItem('fw27tab'); if(t) document.querySelector(`.tab[data-tab="${t}"]`)?.click();}catch(e){}
update();
